<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D2A6E">
<title>HWH Track Portal</title>
<script>/* theme before first paint (design system, ui.js) */(function(){try{var p=localStorage.getItem("hwhtp.theme")||"light";var d=p==="dark"||(p==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");document.documentElement.setAttribute("data-lang",localStorage.getItem("hwhtp.lang")||"en");}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Hind:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css?v=202611031336">
</head>
<body>
<header class="top">
  <div class="brand"><span class="hbrand"><b>HWH</b><span>TRACK</span></span><img class="logo" src="icons/logo.png" alt=""><span class="bt"><span class="pname" id="pname">HWH Track Portal</span><span class="org" id="porg">एचडब्ल्यूएच ट्रैक पोर्टल · Howrah Division</span></span></div>
  <div class="actions">
    <div id="uiTools" class="row" style="gap:6px;flex-wrap:nowrap"></div>
    <div class="who hidden" id="who"><span class="rolechip" id="whoRole"></span><b id="whoName"></b></div>
    <button class="tb small" id="btnReload" title="Load the newest data">Refresh</button>
  </div>
</header>
<div id="netbar" class="netbar hidden"></div>
<div class="shell">
  <aside id="rail" class="rail hidden">
    <nav id="nav" class="nav"></nav>
    <div class="railfoot" id="railFoot"></div>
  </aside>
  <main id="main">
    <div id="boot" class="busy"><div class="eyebrow">Loading</div><h2>Opening…</h2><div class="bar"><div style="width:40%"></div></div></div>
    <div id="banner"></div>
    <div id="views"></div>
    <footer id="foot" class="small muted" style="margin:28px 0 8px;text-align:center"></footer>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalBody"></div><div class="modalbtns"><button id="modalCancel" class="btn secondary">Close</button><button id="modalOk" class="btn primary hidden">OK</button></div></div></div>
<script src="config.js?v=202611031336"></script>
<script>/* a phone / PC that opened the portal before may still hold old files (service worker copy): if the program files are of another build, clear and load once more */
(function(){ var V='202611031336', got=(window.HWHTP_CONFIG||{}).VERSION||''; if (!/^\d{12}$/.test(V) || got===V) return;
  var k='hwhtp.heal.'+V; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); } catch(e) {}
  var done=function(){ location.reload(); };
  try { Promise.all([ (navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }) : Promise.resolve()),
    (window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(x){ return caches.delete(x); })); }) : Promise.resolve()) ]).then(done, done); } catch(e) { done(); }
})();</script>
<script src="store.js?v=202611031336"></script>
<script src="ui.js?v=202611031336"></script>
<script src="engine.js?v=202611031336"></script>
<script src="app.js?v=202611031336"></script>
<script src="loc.js?v=202611031336"></script>
<script src="register.js?v=202611031336"></script>
<script src="admin.js?v=202611031336"></script>
<script src="front.js?v=202611031336"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
